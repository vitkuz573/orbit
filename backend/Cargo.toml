[package]
name = "orbit-backend"
version = "0.1.0"
edition = "2024"
description = "Orbit — enterprise Android device management platform"

[dependencies]
actix-web = "4"
actix-cors = "0.7"
actix-ws = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
regex = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-actix-web = "0.7"
config = { version = "0.15", features = ["toml"] }
directories = "6"
thiserror = "2"
once_cell = "1"
async-trait = "0.1"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
